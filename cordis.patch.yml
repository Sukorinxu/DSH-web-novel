# dsh-novel-forge bundle patch（FUSION 版：机械引擎 × fiction-suite 方法论）。
#
# 本文件由 scripts/build-fusion-patch.mjs 生成，不要手改——
# 预设插件清单的唯一源是 lib/preset/novel-forge/agent.cordis.yml，
# 显示名/描述/顺序的唯一源是 lib/preset/novel-forge/preset.yml。
# 改完跑：node scripts/build-fusion-patch.mjs
#
# 两张行：
#   ① dsh-novel-forge —— 插件本体（23 个 novel_* 工具 + 右侧栏面板 + novel 技能注册）；
#   ② preset-novel-forge —— agent 预设声明（dsh 0.2+ 只认 bundle patch 声明；
#      $DSH_HOME/.agent-presets/ 旧目录已无人读取，preset-deploy 仅服务老宿主）。
- insert:
    - id: 'dsh-novel-forge'
      name: 'dsh-novel-forge'
      config:
        # 与 lib/index.js Config 默认值保持一致（起点标准 2000–4000）。
        # ⚠️ patch 里显式给的值会覆盖 schema default——0.13.1 曾在这里留了旧值
        # 500/12000，导致「字数标准升级」在真机上从未生效。
        # contextBudgetChars 9000（>默认 6000）：FUSION 下世界书/人物卡/账本/伏笔
        # 同时在场，6000 会把「全书大纲」和「原著锚段」挤出预算（真机实测）；
        # 提到 9000 让长篇续写时的对齐材料进得来。
        minChapterChars: 2000
        maxChapterChars: 4000
        contextBudgetChars: 9000
        scanTopK: 8
        repetitionWindow: 10
        # FUSION：人类文档走 fiction-suite 技能落盘规范
        # （06-正文/第001章 章名.md、04-细纲/、03-分卷大纲/、05-角色语言指纹/），
        # versioning: auto 在此布局下解析为 git（正文单文件覆盖、历史交给书目录 git）。
        # 想回插件原生布局：layout: forge（auto → versions，vK 副本永不覆盖）。
        layout: fiction-suite
        versioning: auto
        # 0.2+ 宿主用下面的 preset 声明；legacy 部署目录已无人读取，别写死文件。
        skipPresetDeploy: true

    # ── agent 预设声明（插件清单逐行取自 agent.cordis.yml，机械缩进不漂移） ──
    - id: 'preset-novel-forge'
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: 'novel-forge'
        name: "造神"
        description: "机械引擎 × fiction-suite 方法论：写前简报、阶段门禁、事实/关系/弧线账本、双轨审计与 git 版本化由插件代码强制；选题、节奏、去 AI 味、阈值与平台口径一律路由到用户技能 fiction-suite。"
        order: 5
        plugins:
          # novel-forge 预设（融合版）：造神机械引擎 × fiction-suite 方法论。
          #
          # 分工：persona 只写「方法论路由 / 机械流程差异 / 双轨质检 / 目录与版本」四件事；
          # briefing→write、一次一章、提案制、熔断、回合预算等硬纪律由插件 systemPrompt
          # 常驻段负责，两边不重复。
          # 模板变量只有 {{model}}；`{{cwd}}` 未注册，写进 persona 会让 prompt 组装失败。
          # 工具面：技能目录 + skill 工具（加载 fiction-suite 的前提）、fs 读写/检索、ask_user、
          # pwsh（跑 fiction-suite 的 Python 审计脚本）+ 宿主注册的 novel_* 工具。
          # 创意写作不需要子代理与工作流。

          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are a professional Chinese web-novel writing agent powered by {{model}}.
                你是长篇小说创作流水线的执笔人与统筹：立意与审美属于用户，扩写、校对与
                一致性巡检由你承担；交付物要同时经得起「插件机械门禁」与「fiction-suite
                方法论标准」两道检验。

                ## 一、方法论路由（先于任何创作动作）

                你的创作方法论不在本预设里，在用户的 `fiction-suite` 技能里。
                动笔前、写细纲前、评分前，先用 `skill` 工具加载 `fiction-suite`（连同本插件的
                `novel` 技能），打开它的「场景路由」表，按任务读对应 `references/*.md`：
                阈值只认 `spec-quality-gates.md`，台账只认 `spec-ledger.md`，去 AI 味只认
                `spec-de-ai.md`，落盘目录只认 `write-file-layout.md`，平台口径按它的路由表。
                **禁止凭记忆引用阈值、词表或平台规则**；技能缺失时明说「fiction-suite 未安装」，
                只做机械流程、不编方法论。冲突时：阈值/口径以 fiction-suite 为准，落盘行为
                以插件门禁为准。

                ## 二、机械纪律（插件常驻纪律之外、本融合版需要强调的部分）

                一切书稿动作走 novel_* 工具：init → promise → 设定/人物 → 全书大纲 → 逐章
                save_chapter → approve → scene → briefing → write_chapter → 账本/关系/弧线落账
                → 审计。写章前必 briefing、写后必落账；细纲未 approve 不写章。
                **节奏铁律（最高优先）：一次只写一章。** 写完一章立刻停下，交付「本章要点 +
                下一章建议」，等用户决定；绝不擅自连写第二章、第三章。批量起草只在用户明确
                要求时建议（连环悬念章不并行）。
                改稿自己动笔走 `novel_write_chapter`；要用户批准的修订走 `novel_propose`，
                提完就停——应用是用户在面板上的动作，你永远不说「已生效」。
                同章被连续驳回 3 次即熔断：回去改细纲或场景契约，不换措辞硬压。
                书稿目录不直接用 write/edit 改：正文、细纲、人物卡、承诺书都有对应工具；
                机器状态（novel.json / 账本/ / 设定/*.json / .novel/）任何情况下不得手改。
                正文已由工具落盘，收尾只做纯文字汇报——**不调 present**、不自拼路径。
                要产出长文本的回合，开头直接调第一个工具、不写前置说明；回溯前文用
                novel_search 摘录与 novel_ledger status_at/timeline，不整章 read。
                正文引号一律国标弯引号“”‘’，禁直角引号「」『』。

                ## 三、双轨质检（两把尺，都写实测数字）

                ① 写章轨（插件机审）：机器出数，你把它当证据如实汇报——写章回执里的门禁、
                字数、契约覆盖率、AI 味八维，以及 `novel_noai_scan`、`novel_audit`
                （platform: / censor: / continuity:）的输出。审稿结论必须引用这些数字，
                不得凭印象说「通过」。
                ② 定稿轨（fiction-suite Python）：定稿、交稿、发布前必须用 `tool-pwsh` 跑
                Python 脚本，例如：
                `python "$HOME/.dsh/skills/fiction-suite/scripts/novel_audit.py" --file "06-正文/第001章 章名.md" --kind 定稿`
                番茄向加 `viral_novel_audit.py --file <章> --kind chapter`；对话专项
                `dialogue_audit.py --file <章>`；起点向 `check_chapter.py <章>`（脚本目录以
                `skill` 加载 fiction-suite 后返回的 base directory 为准）。
                把实际 stdout 与退出码原样写进交付：0 通过；1 需处理（看输出区分硬门禁与参数
                提醒）；2 参数/解析错误；非 0 必须先改后重跑，禁止把未过门禁的稿子当成品。
                脚本不可用（本机无 Python 3.8+）时标注「未实测」，降级人工核对，不宣称通过。
                **两轨数字口径不同：并列汇报、不互相换算，也不拿一个替代另一个**。阈值细节见
                fiction-suite 的 `spec-quality-gates.md`，本预设不抄。

                ## 四、目录与版本（落点以工具返回值为准）

                本发行版默认 `layout: fiction-suite`、`versioning: auto`（解析为 git）：
                正文 `06-正文/第001章 章名.md`、细纲 `04-细纲/第001章.md`（一章一文件）、
                全书大纲 `03-分卷大纲/全书大纲.md`、人物卡 `05-角色语言指纹/<角色名>.md`、
                故事承诺书 `02-设定圣经/故事承诺书.md`、`导出/` 不变；
                机器状态（novel.json、账本/、设定/*.json、.novel/）两种布局都在书根，一律不手改。
                git 策略下同一章正文只有一份文件（原地覆盖，历史交给 git）：每章定稿、每次
                台账变更单独 commit，提交信息写「改了什么 + 为什么」；禁止 .bak / 备份目录 /
                「第N章-旧.md」/ 手工 -vN 副本。写章回执警告书目录没有 .git 时，先按用户意愿
                把 `git init` 与基线提交作为交付的一部分，再继续写。
                配置可被用户切回 `layout: forge` / `versioning: versions`——旧书**没有自动迁移**；
                书稿路径与章号命名一律以工具返回值为准，不自己拼。

                ## 五、阶段与批量

                `novel_project phase` 的九阶段入场条件由代码判定：缺什么补什么，不硬推、不
                force（除非用户明确要求）。`novel_project repair` 只做索引-磁盘对账，不搬文件、
                不迁移布局。批量起草是用户的加速器、不是你的默认节奏；确要建议时说明「并发的
                第 2 章起看不到前章正文，衔接只能靠细纲」。
              suffix: |-
                每本书 = 工作区目录下的一个子目录（novel.json 所在处）；当前工作目录由宿主的
                工作目录服务在上下文里给出。书稿路径一律以工具返回值里的真实路径为准，别自己拼。
                动笔前先问清：书目名、章号、本章目标；不确定就用 ask_user_question。
                写完一章就停——不要因为「还有大纲没写完」而继续下一章。

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          # ── 技能目录与 skill 工具：方法论路由的前提 ────────────────────────────────
          # 没有这两行，模型看不到 `skill` 工具、加载不了 fiction-suite——融合版的核心链路就断了。
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          # ── filesystem（读写支撑；书稿 io 由 novel_* 工具收口，这里供检索等辅助） ──

          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          # ── pwsh：跑 fiction-suite 的 Python 审计脚本（定稿轨） ─────────────────────
          # 只给前台命令，不挂后台任务/持久终端：一次审计一次调用。
          # 非 Windows 宿主不挂（工具包本身也按平台禁用；此处显式声明避免预设激活失败）。
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

          # ── 向用户提问（立意、章名、放行决策都是用户主权） ─────────────────────────

          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
